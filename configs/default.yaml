# Fixed before the tests were run.
universe: [BX, KKR, APO, CG, ARES]        # the five largest US-listed alternative asset managers with weekly data from 2012-2014; equal weight, rebalanced weekly
sample_start: "2012-06-01"
benchmark: "S&P 500 (SPY) held at the basket's trailing 104-week beta, shifted one week, financed at 3-month T-bills; 5 bp on changes in the SPY position"
hypothesis: "Listed GP stocks are leveraged equity: after matching their past beta with the S&P 500, the excess return is indistinguishable from zero."
split: "2020-01-01"                       # reported 2014-2019 and 2020-2026
robustness: {lookback_weeks: [52, 156], cost_bp: [5, 20]}
sources:
